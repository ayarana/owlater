<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Save link</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 16px;
      background-color: var(--bg); background-image: var(--bg-image, none);
      color: var(--text); font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    h1 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 12px; font-weight: 700; }
    h1 svg { width: 18px; height: 18px; color: var(--accent); }
    .page { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
    #title { font-weight: 600; overflow-wrap: anywhere; }
    #url { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    textarea, select {
      width: 100%; padding: 8px 10px; margin-bottom: 12px; font: inherit; font-size: 13px;
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    }
    textarea { resize: vertical; }
    textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; transition: filter .12s; }
    #save { background: var(--accent); color: var(--accent-contrast); }
    #save:hover:not(:disabled) { filter: brightness(1.08); }
    #save:disabled { opacity: .45; cursor: default; }
    #board { background: transparent; color: var(--accent); margin-top: 6px; font-weight: 500; }
    #board:hover { background: var(--col); }
    #msg { min-height: 18px; margin-top: 8px; font-size: 13px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
    Lateread
  </h1>
  <div class="page">
    <div id="title">…</div>
    <div id="url"></div>
  </div>
  <label for="note">Note (optional)</label>
  <textarea id="note" rows="2" placeholder="Why do you want to read this?"></textarea>
  <label for="col">Save to</label>
  <select id="col"></select>
  <button id="save">Save</button>
  <div id="msg"></div>
  <button id="board">Open board</button>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
