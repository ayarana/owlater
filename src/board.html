<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lateread</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <header>
    <h1 data-icon="bookmark">Lateread</h1>
    <div class="actions">
      <button id="add-manual" data-icon="plus">Add link</button>
      <button id="advance" data-icon="chevrons-right" title="Moves the oldest cards up to the next column until it's full">Advance queue</button>
      <button id="export-json" data-icon="download" title="Full backup, can be imported back">Export</button>
      <button id="import" data-icon="upload">Import</button>
      <button id="toggle-settings" data-icon="sliders-horizontal">Settings</button>
      <input type="file" id="import-file" accept="application/json" hidden />
    </div>
  </header>

  <section id="settings" hidden>
    <div class="set-title">Theme</div>
    <div id="theme-picker" class="theme-picker"></div>
    <hr class="divider" />
    <label>
      <input type="checkbox" id="s-expire" />
      Auto-delete cards sitting in "Later" for
      <input type="number" id="s-days" min="1" max="365" /> days
    </label>
    <small>Off: cards turn red. On (hardcore mode): cards are permanently deleted.</small>
    <label>
      <input type="checkbox" id="s-advance" />
      Advance the queue automatically, once a day
    </label>
    <small>Cards move up to the next column automatically once a day. The column must have room.</small>
    <label id="notify-row">
      <input type="checkbox" id="s-notify" />
      Daily reminder
    </label>
    <small id="notify-hint">The browser must be allowed to show notifications.</small>
    <label>
      Daily time (reminder and queue advance): <input type="time" id="s-time" />
    </label>
    <hr class="divider" />
    <label>
      <input type="checkbox" id="s-strict" />
      Commitment mode
    </label>
    <small>Only lets you delete or mark as read cards in the "Now" column.</small>
  </section>

  <main id="board"></main>

  <div id="toast" role="status"></div>
  <script src="storage.js"></script>
  <script src="board.js"></script>
</body>
</html>
